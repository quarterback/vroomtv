# fly.toml app configuration file generated for vroomtv on 2026-06-12T03:13:50Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vroomtv'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  # No volume: sync.py re-pulls every sim's /export/db feed seconds after
  # boot and every SYNC_INTERVAL_MIN minutes, so the DB copies can live on
  # ephemeral disk. Pair each *_SYNC_TOKEN secret on this app with that
  # sim's EXPORT_TOKEN secret. A missing/unreachable feed shows a
  # placeholder.
  BASEBALL_DB = '/app/data/o27v2.db'
  BASEBALL_SYNC_URL = 'https://superinnin.gs/export/db'
  BASEBALL_PORTAL_URL = 'https://superinnin.gs'
  PORT = '8080'
  SYNC_INTERVAL_MIN = '30'
  TENNIS_DB = '/app/data/tennis.db'
  TENNIS_SYNC_URL = 'https://pctennis.xyz/export/db'
  TENNIS_PORTAL_URL = 'https://pctennis.xyz'
  VIPERBALL_DB = '/app/data/viperball.db'
  VIPERBALL_SYNC_URL = 'https://viperball.xyz/export/db'
  VIPERBALL_PORTAL_URL = 'https://viperball.xyz/stats'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
