app = "vroomtv"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # The hub reads each sim's SQLite file read-only from the volume below.
  # Upload snapshots with `fly sftp shell` → `put <file> /data/<name>.db`.
  # Any missing file shows a wire-service placeholder, not an error.
  BASEBALL_DB = "/data/o27v2.db"
  VIPERBALL_DB = "/data/viperball.db"
  TENNIS_DB = "/data/tennis.db"

[[mounts]]
  source = "vroomtv_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
