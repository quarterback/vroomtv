# fly.toml app configuration file generated for vroomtv on 2026-06-12T03:13:50Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vroomtv'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  # No volume: sync.py re-pulls every sim's /export/db feed seconds after
  # boot and every SYNC_INTERVAL_MIN minutes, so the DB copies can live on
  # ephemeral disk. Pair each *_SYNC_TOKEN secret on this app with that
  # sim's EXPORT_TOKEN secret. A missing/unreachable feed shows a
  # placeholder.
  BASEBALL_DB = '/app/data/o27v2.db'
  BASEBALL_SYNC_URL = 'https://superinnin.gs/export/db'
  BASEBALL_PORTAL_URL = 'https://superinnin.gs'
  PICKS_DB = '/picks_data/picks.db'
  PORT = '8080'
  # Soccer feed: scraped from a self-hosted open-football instance (no JSON
  # API). sync.py writes data/soccer.json; pages read that cache.
  SOCCER_BASE_URL = 'https://football.superinnings.com'
  SOCCER_DATA = '/app/data/soccer.json'
  SYNC_INTERVAL_MIN = '30'
  TENNIS_DB = '/app/data/tennis.db'
  TENNIS_SYNC_URL = 'https://pctennis.xyz/export/db'
  TENNIS_PORTAL_URL = 'https://pctennis.xyz'
  VIPERBALL_DB = '/app/data/viperball.db'
  VIPERBALL_SYNC_URL = 'https://viperball.xyz/export/db'
  VIPERBALL_PORTAL_URL = 'https://viperball.xyz/stats'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

# picks.db must survive restarts — mount a persistent volume.
# One-time setup before first deploy:
#   fly volumes create picks_data --region ams --size 1 --app vroomtv
[[mounts]]
  source      = 'picks_data'
  destination = '/picks_data'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  # The tennis DB alone is >120MB and the cache rebuilds parse thousands
  # of JSON blobs; 256MB was swap-thrash territory.
  memory_mb = 512
