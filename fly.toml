app = "vroomtv"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # The hub reads each sim's SQLite file read-only from the volume below,
  # and refills those files itself by pulling each sim's /export/db feed
  # (see sync.py). Set the SYNC_TOKEN secret to the same value as each
  # sim's EXPORT_TOKEN secret. A missing file shows a placeholder.
  BASEBALL_DB = "/data/o27v2.db"
  VIPERBALL_DB = "/data/viperball.db"
  TENNIS_DB = "/data/tennis.db"
  BASEBALL_SYNC_URL = "https://superinnin.gs/export/db"
  VIPERBALL_SYNC_URL = "https://viperball.xyz/export/db"
  TENNIS_SYNC_URL = "https://pctennis.xyz/export/db"
  SYNC_INTERVAL_MIN = "30"

[[mounts]]
  source = "vroomtv_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep the machine awake: the background DB sync (sync.py) only runs
  # while the app is up, and a stopped hub never refreshes its scores.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
