{% macro filter_bar(catalog, entry, sel, endpoint, confs=None, sel_conf='') %}
<form class="filter-bar" method="get" action="{{ url_for(endpoint) }}">
  <select name="sport" aria-label="Sport" onchange="this.form.league.selectedIndex=-1;{% if confs is not none %}this.form.conf.selectedIndex=-1;{% endif %}this.form.submit()">
    {% for c in catalog %}
    <option value="{{ c.sport }}"{% if entry and c.sport == entry.sport %} selected{% endif %}>{{ c.sport }}</option>
    {% endfor %}
  </select>
  <select name="league" aria-label="League" onchange="{% if confs is not none %}this.form.conf.selectedIndex=-1;{% endif %}this.form.submit()">
    {% if entry %}{% for tier in ['Pro', 'College', 'International'] %}
    {% set leagues = entry.leagues | selectattr('tier', 'equalto', tier) | list %}
    {% if leagues %}
    <optgroup label="{{ tier }} {{ entry.sport }}">
      {% for l in leagues %}
      <option value="{{ l.label }}"{% if sel and l.label == sel.label %} selected{% endif %}>{{ l.label }}</option>
      {% endfor %}
    </optgroup>
    {% endif %}
    {% endfor %}{% endif %}
  </select>
  {% if confs %}
  <select name="conf" aria-label="Conference" onchange="this.form.submit()">
    <option value="">All conferences</option>
    {% for c in confs %}
    <option value="{{ c }}"{% if c == sel_conf %} selected{% endif %}>{{ c }}</option>
    {% endfor %}
  </select>
  {% endif %}
  <noscript><button type="submit">Go</button></noscript>
</form>
{% endmacro %}

{% macro scorecard(url, away, home, ascore, hscore, note='') %}
<a class="card" {% if url %}href="{{ url }}"{% endif %}>
  <span class="card-note">{{ note or 'Final' }}</span>
  <span class="card-row {{ 'won' if ascore > hscore else 'lost' }}"><span>{{ away }}</span><b>{{ ascore }}</b></span>
  <span class="card-row {{ 'won' if hscore >= ascore else 'lost' }}"><span>{{ home }}</span><b>{{ hscore }}</b></span>
</a>
{% endmacro %}
